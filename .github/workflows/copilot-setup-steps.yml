# ⭐ 4. PASUL 4: Creezi „Founder Account” (acces nelimitat)

### Cum îl creezi?

1. Creezi un user normal  
2. Îi setezi rolul **Founder**  
3. Îi setezi licența **Unlimited**  
4. Îi setezi quota **Unlimited**  
5. Îi dai acces la **Admin Dashboard**  

Gata.

