[package]
name = "fall_input"
version = "0.1.0"
edition = "2021"
authors = ["LRF"]
description = "Formally verified, haptic-polymorphic multi-tap sequential authentication protocol."
license = "Apache-2.0"
publish = false

[dependencies]
zeroize = { version = "1.7", features = ["derive"] }
coarse-prof = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
